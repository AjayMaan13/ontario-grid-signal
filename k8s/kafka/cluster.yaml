apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: grid-kafka
spec:
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    template:
      pod:
        metadata:
          annotations:
            # Datadog's agent on this node runs the consumer-lag check for every consumer group (kafka.consumer_lag)
            ad.datadoghq.com/kafka.checks: |
              {"kafka_consumer": {"init_config": {}, "instances": [{"kafka_connect_str": "grid-kafka-kafka-bootstrap.kafka:9092", "monitor_unlisted_consumer_groups": true}]}}
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1 # only 1 broker exists, so this must be 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {} # lets KafkaTopic YAML files create real topics
    userOperator: {}
