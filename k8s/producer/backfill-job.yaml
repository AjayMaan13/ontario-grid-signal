# Replays every archived file through the same code as live mode. Run this BEFORE the live
# Deployment: both write the same checkpoint file, so they must not run at the same time.
apiVersion: batch/v1
kind: Job
metadata:
  name: producer-backfill
  namespace: grid
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: producer
      restartPolicy: Never
      containers:
        - name: producer
          image: northamerica-northeast2-docker.pkg.dev/ontario-grid-signal/grid/producer:latest
          env:
            - {name: DD_AGENT_HOST, valueFrom: {fieldRef: {fieldPath: status.hostIP}}}
            - {name: MODE, value: backfill}
            - {name: KAFKA_BOOTSTRAP, value: "grid-kafka-kafka-bootstrap.kafka:9092"}
            - {name: RAW_BUCKET, value: ontario-grid-signal-raw}
            - {name: CHECKPOINT_URI, value: "gs://ontario-grid-signal-state/producer/checkpoint.json"}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
