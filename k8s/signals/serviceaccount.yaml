apiVersion: v1
kind: Namespace
metadata:
  name: grid
---
# Acts as the Google service account sa-signals (Workload Identity, linked in infra/main/iam.tf)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: signals
  namespace: grid
  annotations:
    iam.gke.io/gcp-service-account: sa-signals@ontario-grid-signal.iam.gserviceaccount.com
